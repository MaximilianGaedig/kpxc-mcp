[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kpxc-mcp"
version = "0.1.0"
description = "MCP server that lets an agent use KeePassXC logins and tokens without seeing them"
requires-python = ">=3.11"
dependencies = ["pynacl", "websockets"]
license = "MIT"

[project.scripts]
kpxc-mcp = "kpxc_mcp.__main__:main"

[tool.setuptools]
packages = ["kpxc_mcp"]
